services:
  workspace:
    build: .
    working_dir: /workspaces/caniello
    env_file:
      - .env.local
    ports:
      - "3000:3000"
      - "54321:54321"
      - "54322:54322"
      - "54323:54323"
      - "54324:54324"
    volumes:
      - .:/workspaces/caniello
      - pnpm-store:/home/node/.local/share/pnpm/store
    command: sleep infinity

volumes:
  pnpm-store:
