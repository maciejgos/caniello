services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/caniello
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
      - "54321:54321"
      - "54322:54322"
      - "54323:54323"
      - "54324:54324"
    volumes:
      - .:/workspaces/caniello
      - pnpm-store:/pnpm/store
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity

volumes:
  pnpm-store:
